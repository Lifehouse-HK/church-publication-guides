name: Publish enacted Guides
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '10 16 * * *'
permissions:
  contents: read
concurrency:
  group: publication-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Check out reviewed publication engine
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: Lifehouse-HK/style-guide-studio
          ref: bca9dba431a28f73f64d0ffeef09716df2f7fe60
          path: .engine
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: .engine/package-lock.json
      - name: Install free publication fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-liberation fonts-noto-cjk
      - run: npm ci
        working-directory: .engine
      - name: Build validated publication and API atomically
        working-directory: .engine
        run: npm run publish:corpus -- ../corpus.json ../generated
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: generated
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
